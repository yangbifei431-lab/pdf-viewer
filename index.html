<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 在线查看</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      padding: 20px 24px;
      background: #0f172a;
      color: #fff;
    }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; color: #cbd5e1; font-size: 14px; }

    .layout {
      display: flex;
      height: calc(100vh - 90px);
      min-height: 600px;
    }

    .sidebar {
      width: 300px;
      padding: 16px;
      background: #fff;
      border-right: 1px solid #e5e7eb;
      overflow: auto;
    }

    .pdf-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
    }

    .pdf-btn:hover { background: #f1f5f9; }

    .pdf-btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .toolbar a {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .toolbar a:hover { text-decoration: underline; }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid #e5e7eb; }
      iframe { height: 72vh; }
    }
  </style>
</head>
<body>

<header>
  <h1>PDF 在线查看</h1>
  <p>请选择要查看的 PDF 文件</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="pdf-btn active" data-pdf="weekly.pdf">
      作品1：杨璧霏-周报案例
    </button>
    <button class="pdf-btn" data-pdf="hangyan.pdf">
      作品2：杨璧霏-行研案例
    </button>
    <button class="pdf-btn" data-pdf="unsc-rules.pdf">
      作品3：杨璧霏-会议活动策划（节选）案例
    </button>
  </aside>

  <main class="viewer">
    <div class="toolbar">
      <a id="openNew" href="hangyan.pdf" target="_blank" rel="noopener">新窗口打开</a>
      <a id="download" href="hangyan.pdf" download>下载</a>
    </div>
    <iframe id="pdfFrame" src="hangyan.pdf" title="PDF 在线查看"></iframe>
  </main>
</div>

<script>
  const frame = document.getElementById('pdfFrame');
  const openNew = document.getElementById('openNew');
  const download = document.getElementById('download');
  const buttons = document.querySelectorAll('.pdf-btn');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const pdf = btn.dataset.pdf;
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = pdf;
      openNew.href = pdf;
      download.href = pdf;
    });
  });
</script>

</body>
</html>
